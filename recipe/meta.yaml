{% set name = "flask-oidc" %}
{% set version = "2.4.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz"
  sha256: "e72378fcea8f90ccab874836a61f1783092a900c965e52587c1307e38b2e2153"

build:
  noarch: python
  number: 0
  entry_points:
    - oidc-register=flask_oidc.registration_util:main
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "

requirements:
  host:
    - flask
    - pip
    - python {{ python_min }}
  run:
    - flask
    - itsdangerous
    - oauth2client
    - python >={{ python_min }}
    - six

test:
  requires:
    - python {{ python_min }}
  imports:
    - flask_oidc
  commands:
    - oidc-register --help


about:
  home: "https://github.com/puiterwijk/flask-oidc"
  license: "BSD-2-Clause"
  license_family: "BSD"
  license_file: "LICENSE.txt"
  summary: "OpenID Connect extension for Flask"
  description: |
    Flask-OIDC is an extension to Flask that allows you to add OpenID
    Connect based authentication to your website in a matter of minutes.

  doc_url: "https://flask-oidc.readthedocs.io/"
  dev_url: "https://github.com/puiterwijk/flask-oidc"

extra:
  recipe-maintainers:
    - mxr-conda
